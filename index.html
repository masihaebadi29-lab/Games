<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Torbat Arena | آرنای تربت</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: radial-gradient(ellipse at top, #1a1a2e 0%, #0f0f1e 50%, #000 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, #fff, transparent),
                radial-gradient(2px 2px at 60% 70%, #fff, transparent),
                radial-gradient(1px 1px at 50% 50%, #fff, transparent),
                radial-gradient(1px 1px at 80% 10%, #fff, transparent),
                radial-gradient(2px 2px at 90% 60%, #fff, transparent),
                radial-gradient(1px 1px at 33% 80%, #fff, transparent);
            background-size: 200% 200%;
            opacity: 0.4;
            animation: twinkle 5s infinite alternate;
            pointer-events: none;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 0.6; }
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 700px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .crown {
            font-size: 5rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px gold);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 50%, #ff4500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #b8b8d1;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .swords {
            font-size: 2rem;
            margin: 20px 0 30px;
            letter-spacing: 15px;
            opacity: 0.7;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            margin-bottom: 50px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 340px;
            padding: 20px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            color: #1a1a2e;
            border: none;
            border-radius: 60px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-gold {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            box-shadow: 
                0 10px 30px rgba(255, 140, 0, 0.4),
                0 0 0 0 rgba(255, 215, 0, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 10px 30px rgba(255, 140, 0, 0.4), 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { box-shadow: 0 10px 30px rgba(255, 140, 0, 0.4), 0 0 0 20px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 10px 30px rgba(255, 140, 0, 0.4), 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        .btn-purple {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: #fff;
            box-shadow: 
                0 10px 30px rgba(168, 85, 247, 0.4),
                0 0 0 0 rgba(168, 85, 247, 0.7);
            animation: pulse-purple 2s infinite;
        }

        @keyframes pulse-purple {
            0% { box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4), 0 0 0 0 rgba(168, 85, 247, 0.7); }
            70% { box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4), 0 0 0 20px rgba(168, 85, 247, 0); }
            100% { box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4), 0 0 0 0 rgba(168, 85, 247, 0); }
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.03);
        }

        .btn-gold:hover {
            box-shadow: 0 15px 40px rgba(255, 140, 0, 0.6);
        }

        .btn-purple:hover {
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.6);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-icon {
            font-size: 1.5rem;
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.3;
        }

        .btn-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .btn-desc {
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.75;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
        }

        .feature {
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            transition: all 0.3s;
        }

        .feature:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
            transform: translateY(-3px);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .feature-text {
            font-size: 0.9rem;
            color: #b8b8d1;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #666;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .crown { font-size: 3.5rem; }
            .btn { padding: 16px 30px; font-size: 1.1rem; max-width: 300px; }
            .subtitle { font-size: 1rem; }
            .swords { font-size: 1.5rem; letter-spacing: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="crown">👑</div>
        <h1>آرنای تربت</h1>
        <p class="subtitle">دنیای بازی‌های حماسی</p>
        
        <div class="swords">⚔️ 🛡️ ⚔️</div>

        <div class="buttons">
            <a href="GladiatorArena.html" class="btn btn-gold">
                <span class="btn-icon">⚔️</span>
                <span class="btn-text">
                    <span class="btn-title">آرنای گلادیاتورها</span>
                    <span class="btn-desc">نبرد کارت‌های حماسی</span>
                </span>
            </a>

            <a href="bloff.html" class="btn btn-purple">
                <span class="btn-icon">🎭</span>
                <span class="btn-text">
                    <span class="btn-title">بلوف</span>
                    <span class="btn-desc">بازی حدس و فریب</span>
                </span>
            </a>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div class="feature-text">نبرد با هوش مصنوعی</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🎭</div>
                <div class="feature-text">طلسم‌های مخفی</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🏆</div>
                <div class="feature-text">دستاورد و پاداش</div>
            </div>
        </div>

        <div class="footer">
            ساخته شده با Torbat
        </div>
    </div>
</body>
</html>
